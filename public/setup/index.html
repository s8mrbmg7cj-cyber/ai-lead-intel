<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Forward your calls — AI Lead Intel</title>
<meta name="description" content="One step to get your AI receptionist live." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #08080a;
  --bg-2: #0c0c0f;
  --surface: #111114;
  --surface-2: #16161b;
  --surface-3: #1c1c22;
  --border: rgba(255,255,255,0.06);
  --border-2: rgba(255,255,255,0.10);
  --border-3: rgba(255,255,255,0.14);
  --text: #fafafa;
  --text-soft: #d4d4d8;
  --text-dim: #a1a1aa;
  --text-faint: #71717a;
  --text-muted: #52525b;
  --brand: #ff6a00;
  --brand-2: #ff9a00;
  --brand-3: #ff8533;
  --brand-glow: rgba(255,106,0,0.32);
  --brand-soft: rgba(255,106,0,0.10);
  --brand-tint: rgba(255,106,0,0.05);
  --brand-line: rgba(255,106,0,0.22);
  --green: #34d399;
  --green-soft: rgba(52,211,153,0.10);
  --green-line: rgba(52,211,153,0.25);
  --blue: #3b82f6;
  --blue-soft: rgba(59,130,246,0.10);
  --blue-line: rgba(59,130,246,0.25);
}
html, body { height: 100%; }
body {
  font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  letter-spacing: -0.011em;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  line-height: 1.55;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 70% 40% at 50% -10%, rgba(255,106,0,0.12), transparent 60%),
    radial-gradient(ellipse 50% 30% at 100% 0%, rgba(255,154,0,0.07), transparent 50%),
    radial-gradient(ellipse 40% 30% at 0% 60%, rgba(255,106,0,0.04), transparent 60%);
  pointer-events: none; z-index: 0;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

.topnav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(8,8,10,0.72);
  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
  border-bottom: 1px solid var(--border);
  padding: 14px 28px;
  display: flex; justify-content: space-between; align-items: center;
}
.logo { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; letter-spacing: -0.02em; }
.logo-mark {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  box-shadow: 0 0 18px var(--brand-glow), inset 0 1px 0 rgba(255,255,255,0.25);
  position: relative; overflow: hidden;
}
.logo-mark::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,0.22));
}
.nav-help {
  font-size: 13px; color: var(--text-dim);
  transition: color 0.15s; font-weight: 500;
}
.nav-help:hover { color: var(--text); }

.wrap {
  position: relative; z-index: 1;
  max-width: 640px;
  margin: 0 auto;
  padding: 56px 24px 96px;
}

.hero { text-align: center; margin-bottom: 36px; }
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'Geist Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--brand);
  background: var(--brand-soft);
  border: 1px solid var(--brand-line);
  padding: 6px 14px;
  border-radius: 99px;
  font-weight: 600;
  margin-bottom: 20px;
}
.hero-eyebrow .dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--brand);
  box-shadow: 0 0 8px var(--brand-glow);
  animation: pulse 1.6s ease-in-out infinite;
}
.hero-eyebrow.pending { color: var(--blue); background: var(--blue-soft); border-color: var(--blue-line); }
.hero-eyebrow.pending .dot { background: var(--blue); box-shadow: 0 0 8px rgba(59,130,246,0.5); }
.hero-eyebrow.live { color: var(--green); background: var(--green-soft); border-color: var(--green-line); }
.hero-eyebrow.live .dot { background: var(--green); box-shadow: 0 0 8px rgba(52,211,153,0.6); }
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(0.7); }
}
.hero-title {
  font-size: clamp(32px, 5vw, 44px);
  font-weight: 600;
  letter-spacing: -0.035em;
  line-height: 1.08;
  margin-bottom: 14px;
}
.hero-title .accent {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-weight: 400;
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero-title .accent.green {
  background: linear-gradient(135deg, var(--green), #4ade80);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero-sub {
  font-size: 15px;
  color: var(--text-dim);
  line-height: 1.6;
  max-width: 480px;
  margin: 0 auto;
}
.hero-business {
  margin-top: 12px;
  display: inline-block;
  font-family: 'Geist Mono', monospace;
  font-size: 11px;
  color: var(--text-faint);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 600;
  padding: 4px 11px;
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: 99px;
}

.card {
  background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 36px;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.04) inset,
    0 32px 80px rgba(0,0,0,0.5),
    0 12px 28px rgba(0,0,0,0.35);
  position: relative;
  overflow: hidden;
  margin-bottom: 18px;
}
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-3), transparent);
}
.card::after {
  content: '';
  position: absolute; top: -1px; left: 25%; right: 25%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,106,0,0.55), transparent);
}

/* ==================== LOADING STATE ==================== */
.state-loading {
  text-align: center;
  padding: 32px 16px;
}
.loading-spinner {
  width: 32px; height: 32px;
  margin: 0 auto 18px;
  border: 3px solid var(--surface-3);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  font-family: 'Geist Mono', monospace;
  font-size: 11px;
  color: var(--text-faint);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 600;
}

/* ==================== PENDING STATE ==================== */
.state-pending {
  text-align: center;
  padding: 12px 0;
}
.pending-icon {
  width: 64px; height: 64px;
  margin: 0 auto 22px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--blue-soft) 0%, transparent 100%);
  border: 1px solid var(--blue-line);
  color: var(--blue);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.pending-icon::before {
  content: '';
  position: absolute; inset: -4px;
  border-radius: 22px;
  border: 1px solid var(--blue-line);
  opacity: 0.4;
  animation: pulseRing 2.5s ease-out infinite;
}
@keyframes pulseRing {
  0% { transform: scale(0.85); opacity: 0.5; }
  100% { transform: scale(1.18); opacity: 0; }
}
.pending-title {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
  line-height: 1.25;
}
.pending-sub {
  font-size: 14.5px;
  color: var(--text-dim);
  line-height: 1.6;
  max-width: 440px;
  margin: 0 auto 22px;
}
.pending-steps {
  text-align: left;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  max-width: 420px;
  margin: 0 auto;
}
.pending-steps-label {
  font-family: 'Geist Mono', monospace;
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-faint);
  font-weight: 600;
  margin-bottom: 12px;
}
.pending-step {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 7px 0;
  font-size: 13.5px;
  color: var(--text-soft);
  line-height: 1.5;
}
.pending-step-icon {
  width: 18px; height: 18px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 2px;
  display: flex; align-items: center; justify-content: center;
}
.pending-step-icon.done {
  background: var(--green); color: #fff;
}
.pending-step-icon.current {
  background: var(--blue-soft);
  border: 1.5px solid var(--blue);
  position: relative;
}
.pending-step-icon.current::after {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--blue);
  animation: pulseDot 1.4s ease-in-out infinite;
}
@keyframes pulseDot {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.6); }
}
.pending-step-icon.upcoming {
  background: var(--surface-3);
  border: 1.5px solid var(--border-3);
}
.pending-step strong { color: var(--text); font-weight: 600; }
.pending-step.upcoming-text { color: var(--text-faint); }

/* ==================== READY STATE ==================== */
.number-block {
  text-align: center;
  padding: 6px 0 22px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}
.number-label {
  font-family: 'Geist Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-faint);
  font-weight: 600;
  margin-bottom: 14px;
}
.number-big {
  display: inline-block;
  font-family: 'Geist Mono', monospace;
  font-size: clamp(34px, 6vw, 46px);
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1;
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 14px;
  word-break: break-all;
  cursor: pointer;
  transition: opacity 0.18s, transform 0.18s;
  border-bottom: 1px dashed transparent;
  padding-bottom: 2px;
}
.number-big:hover { opacity: 0.88; transform: translateY(-1px); border-bottom-color: var(--brand-line); }
.number-big:active { transform: translateY(0); opacity: 0.7; }
.number-action-row {
  display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
}
.number-action-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px;
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: 9px;
  font-size: 12.5px;
  color: var(--text-dim);
  font-weight: 500;
  transition: all 0.15s;
  font-family: 'Geist Mono', monospace;
  letter-spacing: 0.04em;
}
.number-action-btn:hover {
  background: var(--surface-3);
  border-color: var(--border-3);
  color: var(--text);
}
.number-action-btn.copied {
  background: var(--green-soft);
  border-color: var(--green-line);
  color: var(--green);
}

.instruction-block { margin-bottom: 24px; }
.instruction-title {
  font-family: 'Geist Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-faint);
  font-weight: 600;
  margin-bottom: 14px;
}
.instruction-body code {
  font-family: 'Geist Mono', monospace;
  background: var(--surface-3);
  color: var(--brand);
  padding: 2px 7px;
  border-radius: 5px;
  font-size: 13px;
  border: 1px solid var(--border-2);
}

.steps-list {
  list-style: none;
  display: flex; flex-direction: column;
  gap: 10px;
  margin-top: 8px;
}
.steps-list li {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 11px;
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--text-soft);
  transition: border-color 0.15s;
}
.steps-list li:hover { border-color: var(--border-2); }
.steps-list li strong { color: var(--text); font-weight: 600; }
.step-num {
  width: 26px; height: 26px;
  border-radius: 7px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-line);
  color: var(--brand);
  font-family: 'Geist Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
  letter-spacing: 0.06em;
}
.steps-content { flex: 1; min-width: 0; }

.trust-block {
  margin-top: 22px;
  padding: 14px 16px;
  background: var(--green-soft);
  border: 1px solid var(--green-line);
  border-radius: 11px;
  display: flex; gap: 12px; align-items: flex-start;
}
.trust-icon {
  width: 26px; height: 26px;
  border-radius: 7px;
  background: rgba(52,211,153,0.18);
  border: 1px solid var(--green-line);
  color: var(--green);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.trust-text {
  font-size: 13px;
  color: var(--text-soft);
  line-height: 1.55;
}
.trust-text strong { color: var(--text); font-weight: 600; }
.trust-text code {
  font-family: 'Geist Mono', monospace;
  background: var(--surface-3);
  color: var(--brand);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 12px;
  border: 1px solid var(--border-2);
}

.accordion {
  margin-top: 14px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 11px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.accordion:hover { border-color: var(--border-2); }
.accordion.open { border-color: var(--brand-line); }
.accordion-head {
  width: 100%; text-align: left;
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px;
  padding: 14px 16px;
  font-size: 13.5px; font-weight: 500;
  color: var(--text-soft);
  transition: color 0.15s;
}
.accordion-head:hover { color: var(--text); }
.accordion-toggle {
  width: 22px; height: 22px;
  border-radius: 6px;
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-dim);
  flex-shrink: 0;
  transition: all 0.2s;
}
.accordion.open .accordion-toggle {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
  transform: rotate(45deg);
}
.accordion-body {
  max-height: 0; overflow: hidden;
  transition: max-height 0.3s cubic-bezier(0.16,1,0.3,1);
}
.accordion-body-inner {
  padding: 4px 16px 16px;
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.6;
}
.accordion.open .accordion-body { max-height: 360px; }
.carrier-list {
  list-style: none;
  display: flex; flex-direction: column;
  gap: 7px;
  margin-top: 10px;
  margin-bottom: 12px;
}
.carrier-list li {
  display: flex; justify-content: space-between; align-items: center;
  gap: 14px;
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12.5px;
}
.carrier-name { color: var(--text); font-weight: 500; }
.carrier-code {
  font-family: 'Geist Mono', monospace;
  color: var(--brand);
  background: var(--brand-soft);
  border: 1px solid var(--brand-line);
  padding: 2px 8px;
  border-radius: 5px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.accordion-note {
  font-size: 11.5px;
  color: var(--text-faint);
  line-height: 1.55;
  margin-top: 4px;
}
.accordion-note code {
  font-family: 'Geist Mono', monospace;
  background: var(--surface-3);
  color: var(--brand);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 11.5px;
  border: 1px solid var(--border-2);
}

.test-card {
  background:
    radial-gradient(circle at 0% 0%, var(--brand-tint) 0%, transparent 70%),
    linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
  border: 1px solid var(--brand-line);
  border-radius: 18px;
  padding: 28px 26px;
  position: relative; overflow: hidden;
  display: flex; gap: 18px; align-items: center;
}
.test-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--brand), transparent);
}
.test-icon {
  width: 48px; height: 48px;
  border-radius: 13px;
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  box-shadow: 0 8px 20px var(--brand-glow), inset 0 1px 0 rgba(255,255,255,0.25);
  color: #fff;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
.test-text { flex: 1; min-width: 0; }
.test-eyebrow {
  font-family: 'Geist Mono', monospace;
  font-size: 9.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--brand);
  font-weight: 600;
  margin-bottom: 5px;
}
.test-title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.015em;
  margin-bottom: 4px;
  line-height: 1.3;
}
.test-desc {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.55;
}
.test-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 12px 20px;
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-3) 100%);
  color: #fff;
  border-radius: 11px;
  font-size: 13.5px;
  font-weight: 600;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.22),
    0 4px 14px var(--brand-glow);
  transition: all 0.2s;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
.test-btn::before {
  content: '';
  position: absolute; top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
  transition: left 0.6s;
}
.test-btn:hover::before { left: 100%; }
.test-btn:hover {
  transform: translateY(-1px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.28),
    0 10px 28px var(--brand-glow);
}

/* ==================== LIVE STATE ==================== */
.state-live {
  text-align: center;
  padding: 12px 0;
}
.live-icon {
  width: 76px; height: 76px;
  margin: 0 auto 22px;
  border-radius: 22px;
  background: linear-gradient(135deg, var(--green), #4ade80);
  box-shadow:
    0 18px 36px rgba(52,211,153,0.35),
    0 0 0 6px var(--green-soft),
    inset 0 1px 0 rgba(255,255,255,0.3);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  animation: pop 0.6s cubic-bezier(0.16,1,0.3,1);
}
@keyframes pop {
  0% { transform: scale(0.6); opacity: 0; }
  60% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}
.live-title {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.025em;
  margin-bottom: 10px;
  line-height: 1.2;
}
.live-sub {
  font-size: 14.5px;
  color: var(--text-dim);
  line-height: 1.6;
  max-width: 440px;
  margin: 0 auto 24px;
}
.live-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  max-width: 420px;
  margin: 0 auto 22px;
}
.live-stat {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 14px 16px;
  text-align: left;
}
.live-stat-label {
  font-family: 'Geist Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-faint);
  font-weight: 600;
  margin-bottom: 6px;
}
.live-stat-value {
  font-size: 13.5px;
  color: var(--text);
  font-weight: 500;
  font-family: 'Geist Mono', monospace;
  letter-spacing: -0.005em;
  word-break: break-all;
}

.dashboard-cta-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 13px 22px;
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-3) 100%);
  color: #fff;
  border-radius: 11px;
  font-size: 13.5px;
  font-weight: 600;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.22),
    0 4px 14px var(--brand-glow);
  transition: all 0.2s;
}
.dashboard-cta-btn:hover {
  transform: translateY(-1px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.28),
    0 10px 28px var(--brand-glow);
}

/* ==================== ERROR STATE ==================== */
.state-error {
  text-align: center;
  padding: 16px 8px;
}
.error-icon {
  width: 52px; height: 52px;
  margin: 0 auto 18px;
  border-radius: 14px;
  background: var(--surface-3);
  border: 1px solid var(--border-2);
  color: var(--text-dim);
  display: flex; align-items: center; justify-content: center;
}
.error-title {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.015em;
  margin-bottom: 8px;
}
.error-sub {
  font-size: 13.5px;
  color: var(--text-dim);
  line-height: 1.55;
}

.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 22px;
  font-size: 13px;
  color: var(--text-faint);
  font-weight: 500;
  transition: color 0.15s;
}
.back-link:hover { color: var(--text); }

.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface-2);
  border: 1px solid var(--green-line);
  color: var(--green);
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 12.5px;
  font-weight: 500;
  font-family: 'Geist Mono', monospace;
  letter-spacing: 0.04em;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s cubic-bezier(0.16,1,0.3,1);
  box-shadow: 0 12px 36px rgba(0,0,0,0.4);
  z-index: 200;
}
.toast.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (max-width: 620px) {
  .topnav { padding: 12px 16px; }
  .wrap { padding: 36px 16px 80px; }
  .card { padding: 24px 20px; border-radius: 16px; }
  .test-card { padding: 22px; flex-direction: column; align-items: flex-start; text-align: left; gap: 16px; }
  .test-btn { width: 100%; justify-content: center; }
  .hero-title { font-size: 28px; }
  .number-big { font-size: 32px; }
  .live-stats { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<nav class="topnav">
  <a href="/" class="logo">
    <div class="logo-mark"></div>
    <span>AI Lead Intel</span>
  </a>
  <a href="mailto:hello@aileadintel.com" class="nav-help">Need help?</a>
</nav>

<div class="wrap" id="wrap">

  <!-- HEADER (updated dynamically based on state) -->
  <header class="hero" id="hero">
    <div class="hero-eyebrow" id="hero-eyebrow"><span class="dot"></span>Loading...</div>
    <h1 class="hero-title" id="hero-title">Setting up your <span class="accent">AI receptionist</span></h1>
    <p class="hero-sub" id="hero-sub">Checking your account...</p>
    <div id="business-pill" class="hero-business" style="display:none;"></div>
  </header>

  <!-- CONTENT (one of: loading / pending / ready / live / error) -->
  <div id="content">
    <div class="card">
      <div class="state-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading your setup info</div>
      </div>
    </div>
  </div>

  <a href="/dashboard/" class="back-link" id="back-link" style="display:none;">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Go to dashboard
  </a>

</div>

<div class="toast" id="toast">Number copied</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ============================================================
// CONFIG
// ============================================================
const SUPABASE_URL = 'https://mbrhkeddgmywqqgdfdgx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__YkhmAu61Nr8VetJS8pJqA_MHrmO69t';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================
// HELPERS
// ============================================================
function formatPhone(raw) {
  const digits = String(raw || '').replace(/\D/g, '').slice(0, 10);
  if (digits.length < 10) return raw;
  return `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6,10)}`;
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('visible');
  setTimeout(() => toast.classList.remove('visible'), 1800);
}

async function copyToClipboard(text, btnEl, btnTextEl) {
  try {
    await navigator.clipboard.writeText(text);
    if (btnEl && btnTextEl) {
      const original = btnTextEl.textContent;
      btnTextEl.textContent = 'Copied';
      btnEl.classList.add('copied');
      setTimeout(() => {
        btnTextEl.textContent = original;
        btnEl.classList.remove('copied');
      }, 1800);
    }
    showToast('Number copied');
  } catch (e) {
    showToast('Long-press the number to copy');
  }
}

// ============================================================
// READ URL PARAMS
// ============================================================
const params = new URLSearchParams(window.location.search);
const slug = params.get('slug');
const businessParam = params.get('business');
const aiNumberParam = params.get('aiNumber'); // legacy/testing override

// ============================================================
// LOAD SETUP INFO
// ============================================================
async function loadSetupInfo() {
  // If we have a slug, fetch from Supabase
  if (slug) {
    try {
      const { data, error } = await supabase
        .rpc('get_setup_info', { p_slug: slug });

      if (error) throw error;
      if (!data || data.length === 0) {
        renderError('We couldn\'t find your account. Double-check the link from your email or contact support.');
        return;
      }
      const info = data[0];
      renderByStatus(info);
    } catch (e) {
      console.error('Setup info error:', e);
      // If RPC isn't deployed yet OR query failed, fall back to URL param if present
      if (aiNumberParam) {
        renderReady({
          business_name: businessParam || null,
          ai_phone_number: aiNumberParam,
          ai_setup_status: 'ready',
        });
      } else {
        renderError('We couldn\'t load your setup details right now. Please try again, or contact support.');
      }
    }
    return;
  }

  // No slug — fall back to legacy URL params (useful for manual testing)
  if (aiNumberParam) {
    renderReady({
      business_name: businessParam || null,
      ai_phone_number: aiNumberParam,
      ai_setup_status: 'ready',
    });
    return;
  }

  // Nothing to render — show pending generic state
  renderPending({ business_name: null });
}

// ============================================================
// RENDER ROUTER
// ============================================================
function renderByStatus(info) {
  const status = info.ai_setup_status || 'pending';
  const hasNumber = !!(info.ai_phone_number && String(info.ai_phone_number).replace(/\D/g, '').length >= 10);

  if (status === 'live') {
    renderLive(info);
  } else if (status === 'ready' && hasNumber) {
    renderReady(info);
  } else if (status === 'pending' || !hasNumber) {
    renderPending(info);
  } else {
    // Fallback
    renderPending(info);
  }
}

// ============================================================
// PENDING STATE
// ============================================================
function renderPending(info) {
  // Update header
  document.getElementById('hero-eyebrow').className = 'hero-eyebrow pending';
  document.getElementById('hero-eyebrow').innerHTML = '<span class="dot"></span>Setup in progress';
  document.getElementById('hero-title').innerHTML = 'Configuring your <span class="accent">AI receptionist</span>';
  document.getElementById('hero-sub').textContent = 'We\'re assigning your AI receptionist number. This usually takes a few hours.';
  setBusinessPill(info.business_name);

  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="state-pending">
        <div class="pending-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="pending-title">Your AI receptionist number is being configured</div>
        <div class="pending-sub">We're building your AI and assigning a dedicated number. You'll get an email the moment it's ready — usually within a few hours.</div>

        <div class="pending-steps">
          <div class="pending-steps-label">What's happening</div>
          <div class="pending-step">
            <div class="pending-step-icon done">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div><strong>Account created</strong></div>
          </div>
          <div class="pending-step">
            <div class="pending-step-icon current"></div>
            <div><strong>Building your AI &amp; assigning a number</strong></div>
          </div>
          <div class="pending-step upcoming-text">
            <div class="pending-step-icon upcoming"></div>
            <div>Forward your calls to your AI</div>
          </div>
          <div class="pending-step upcoming-text">
            <div class="pending-step-icon upcoming"></div>
            <div>Go live</div>
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('back-link').style.display = 'inline-flex';
}

// ============================================================
// READY STATE
// ============================================================
function renderReady(info) {
  const digits = String(info.ai_phone_number || '').replace(/\D/g, '').slice(0, 10);
  const formatted = formatPhone(digits);
  const telHref = `tel:+1${digits}`;

  // Update header
  document.getElementById('hero-eyebrow').className = 'hero-eyebrow';
  document.getElementById('hero-eyebrow').innerHTML = '<span class="dot"></span>Last Step · Forward Your Calls';
  document.getElementById('hero-title').innerHTML = 'One step to <span class="accent">go live.</span>';
  document.getElementById('hero-sub').textContent = 'Forward your business calls to your AI receptionist. Takes about 2 minutes.';
  setBusinessPill(info.business_name);

  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="number-block">
        <div class="number-label">Your AI receptionist number</div>
        <a href="${telHref}" id="ai-number-link" class="number-big">${escapeHtml(formatted)}</a>
        <div class="number-action-row">
          <button class="number-action-btn" id="copy-btn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span id="copy-text">Copy number</span>
          </button>
          <a href="${telHref}" class="number-action-btn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            Call
          </a>
        </div>
      </div>

      <div class="instruction-block">
        <div class="instruction-title">How to forward your calls</div>
        <div class="instruction-body">
          <ol class="steps-list">
            <li>
              <div class="step-num">01</div>
              <div class="steps-content">From your <strong>business phone</strong>, dial <code>*72</code></div>
            </li>
            <li>
              <div class="step-num">02</div>
              <div class="steps-content">Enter your <strong>AI receptionist number</strong></div>
            </li>
            <li>
              <div class="step-num">03</div>
              <div class="steps-content">Call your business number from another phone to <strong>test it</strong></div>
            </li>
          </ol>
        </div>

        <div class="trust-block">
          <div class="trust-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <polyline points="9 12 11 14 15 10"/>
            </svg>
          </div>
          <div class="trust-text">
            <strong>Your business number stays the same.</strong> You can turn call forwarding off anytime by dialing <code>*73</code> on your business phone.
          </div>
        </div>

        <div class="accordion" id="carrier-accordion">
          <button class="accordion-head" type="button" id="carrier-toggle">
            <span>My carrier's forwarding code isn't working</span>
            <span class="accordion-toggle">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </span>
          </button>
          <div class="accordion-body">
            <div class="accordion-body-inner">
              <p class="accordion-note">Different carriers use slightly different forwarding methods. Try the one that matches your provider:</p>
              <ul class="carrier-list">
                <li><span class="carrier-name">Verizon</span><span class="carrier-code">*72</span></li>
                <li><span class="carrier-name">AT&amp;T</span><span class="carrier-code">*72</span></li>
                <li><span class="carrier-name">T-Mobile</span><span class="carrier-code">**21*</span></li>
                <li><span class="carrier-name">Xfinity / Comcast</span><span class="carrier-code">*72</span></li>
                <li><span class="carrier-name">Google Voice</span><span class="carrier-code">Settings → Calls → Forwarding</span></li>
              </ul>
              <p class="accordion-note">For T-Mobile, dial <code>**21*</code> followed by your AI number, then <code>#</code> and press call.</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="test-card">
      <div class="test-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg>
      </div>
      <div class="test-text">
        <div class="test-eyebrow">Hear it for yourself</div>
        <div class="test-title">Want to hear your AI receptionist before going live?</div>
        <div class="test-desc">Call it directly. The AI will answer just like it will for your customers.</div>
      </div>
      <a href="${telHref}" class="test-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Call &amp; test your AI
      </a>
    </div>
  `;

  // Wire up copy/click
  const copyBtn = document.getElementById('copy-btn');
  const copyText = document.getElementById('copy-text');
  copyBtn.addEventListener('click', () => copyToClipboard(digits, copyBtn, copyText));

  const numberEl = document.getElementById('ai-number-link');
  numberEl.addEventListener('click', (e) => {
    if (!('ontouchstart' in window) && !navigator.userAgent.match(/Mobi|Android|iPhone/i)) {
      e.preventDefault();
      copyToClipboard(digits, copyBtn, copyText);
    }
  });

  document.getElementById('carrier-toggle').addEventListener('click', () => {
    document.getElementById('carrier-accordion').classList.toggle('open');
  });

  document.getElementById('back-link').style.display = 'inline-flex';
}

// ============================================================
// LIVE STATE
// ============================================================
function renderLive(info) {
  const digits = String(info.ai_phone_number || '').replace(/\D/g, '').slice(0, 10);
  const formatted = digits.length === 10 ? formatPhone(digits) : '—';

  // Update header
  document.getElementById('hero-eyebrow').className = 'hero-eyebrow live';
  document.getElementById('hero-eyebrow').innerHTML = '<span class="dot"></span>Live';
  document.getElementById('hero-title').innerHTML = 'Your AI receptionist is <span class="accent green">live.</span>';
  document.getElementById('hero-sub').textContent = 'Calls are being answered. Check your dashboard for incoming leads.';
  setBusinessPill(info.business_name);

  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="state-live">
        <div class="live-icon">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div class="live-title">You're all set.</div>
        <div class="live-sub">Your AI receptionist is taking calls. New leads will appear in your dashboard the moment they're captured.</div>

        <div class="live-stats">
          <div class="live-stat">
            <div class="live-stat-label">AI Receptionist Number</div>
            <div class="live-stat-value">${escapeHtml(formatted)}</div>
          </div>
          <div class="live-stat">
            <div class="live-stat-label">Status</div>
            <div class="live-stat-value" style="color: var(--green);">Operational</div>
          </div>
        </div>

        <a href="/dashboard/" class="dashboard-cta-btn">
          Open dashboard
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>
      </div>
    </div>

    <div class="accordion" id="turn-off-accordion" style="margin-top: 0;">
      <button class="accordion-head" type="button" id="turn-off-toggle">
        <span>How to turn off forwarding</span>
        <span class="accordion-toggle">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </span>
      </button>
      <div class="accordion-body">
        <div class="accordion-body-inner">
          <p class="accordion-note">If you ever want to stop forwarding calls to your AI, dial <code>*73</code> on your business phone. Forwarding turns off immediately.</p>
        </div>
      </div>
    </div>
  `;

  document.getElementById('turn-off-toggle').addEventListener('click', () => {
    document.getElementById('turn-off-accordion').classList.toggle('open');
  });

  document.getElementById('back-link').style.display = 'inline-flex';
}

// ============================================================
// ERROR STATE
// ============================================================
function renderError(msg) {
  document.getElementById('hero-eyebrow').className = 'hero-eyebrow';
  document.getElementById('hero-eyebrow').innerHTML = '<span class="dot"></span>Setup';
  document.getElementById('hero-title').innerHTML = 'Hmm — <span class="accent">something\'s off.</span>';
  document.getElementById('hero-sub').textContent = '';
  document.getElementById('business-pill').style.display = 'none';

  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="state-error">
        <div class="error-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <div class="error-title">We couldn't load your setup info</div>
        <div class="error-sub">${escapeHtml(msg)}<br><br>Email <a href="mailto:hello@aileadintel.com" style="color:var(--brand);">hello@aileadintel.com</a> and we'll sort it out fast.</div>
      </div>
    </div>
  `;
  document.getElementById('back-link').style.display = 'inline-flex';
}

// ============================================================
// HELPERS
// ============================================================
function setBusinessPill(name) {
  const pill = document.getElementById('business-pill');
  if (name) {
    pill.textContent = name;
    pill.style.display = 'inline-block';
  } else {
    pill.style.display = 'none';
  }
}

// ============================================================
// INIT
// ============================================================
loadSetupInfo();
</script>

</body>
</html>
