<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #08080a; --bg-2: #0c0c0f;
  --surface: #111114; --surface-2: #16161b; --surface-3: #1c1c22;
  --border: rgba(255,255,255,0.06); --border-2: rgba(255,255,255,0.10);
  --text: #fafafa; --text-soft: #d4d4d8; --text-dim: #a1a1aa; --text-faint: #71717a;
  --brand: #ff6a00; --brand-2: #ff9a00; --brand-3: #ff8533;
  --brand-glow: rgba(255,106,0,0.32); --brand-soft: rgba(255,106,0,0.10);
  --brand-line: rgba(255,106,0,0.22); --brand-tint: rgba(255,106,0,0.05);
  --green: #34d399; --green-soft: rgba(52,211,153,0.1); --green-line: rgba(52,211,153,0.25);
}
html, body { height: 100%; }
body { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; letter-spacing: -0.011em; overflow-x: hidden; -webkit-font-smoothing: antialiased; line-height: 1.55; }
body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,106,0,0.14), transparent 60%), radial-gradient(ellipse 60% 35% at 100% 0%, rgba(255,154,0,0.07), transparent 55%); pointer-events: none; z-index: 0; }
a { color: inherit; text-decoration: none; }
.topnav { position: sticky; top: 0; z-index: 100; background: rgba(8,8,10,0.72); backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; }
.logo { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; letter-spacing: -0.02em; }
.logo-mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: 0 0 18px var(--brand-glow), inset 0 1px 0 rgba(255,255,255,0.25); }

.wrap { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 56px 24px 80px; text-align: center; }

.check-badge { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), var(--brand-2)); margin: 0 auto 26px; display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 0 0 8px rgba(255,106,0,0.08), 0 10px 30px var(--brand-glow); position: relative; }
.check-badge::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,0.22)); }

.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--brand); background: var(--brand-soft); border: 1px solid var(--brand-line); padding: 7px 14px; border-radius: 99px; font-weight: 600; margin-bottom: 22px; }
.eyebrow .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 6px var(--brand-glow); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.7); } }

h1 { font-size: clamp(30px, 5vw, 44px); font-weight: 600; letter-spacing: -0.035em; line-height: 1.1; margin-bottom: 16px; }
h1 .accent { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; background: linear-gradient(135deg, var(--brand), var(--brand-2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.lead { font-size: 16.5px; color: var(--text-dim); line-height: 1.65; max-width: 520px; margin: 0 auto 36px; }
.lead strong { color: var(--text); font-weight: 600; }

.card { background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%); border: 1px solid var(--border-2); border-radius: 16px; padding: 28px; margin-bottom: 16px; text-align: left; position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,106,0,0.4), transparent); }
.card-title { font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-faint); font-weight: 600; margin-bottom: 14px; }
.next-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.next-list li { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14.5px; color: var(--text-soft); line-height: 1.55; }
.next-list li:last-child { border-bottom: none; padding-bottom: 0; }
.next-list li:first-child { padding-top: 0; }
.next-list .num { width: 26px; height: 26px; border-radius: 8px; background: var(--brand-soft); border: 1px solid var(--brand-line); color: var(--brand); display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 600; flex-shrink: 0; }
.next-list .body strong { color: var(--text); font-weight: 600; display: block; margin-bottom: 2px; }
.next-list .body span { color: var(--text-dim); font-size: 13px; }

.timeline-card { background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%); border: 1px solid var(--brand-line); border-radius: 16px; padding: 22px 24px; margin-bottom: 24px; position: relative; overflow: hidden; }
.timeline-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--brand), transparent); }
.timeline-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.tl { background: rgba(0,0,0,0.18); border: 1px solid var(--border); border-radius: 11px; padding: 12px 14px; text-align: left; }
.tl-when { font-family: 'Geist Mono', monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brand); font-weight: 700; margin-bottom: 4px; }
.tl-text { font-size: 12.5px; color: var(--text); font-weight: 500; line-height: 1.4; }

.support { font-size: 13.5px; color: var(--text-faint); line-height: 1.6; margin-top: 28px; }
.support a { color: var(--brand-2); }
.support a:hover { color: var(--brand); }

@media (max-width: 560px) {
  .wrap { padding: 36px 18px 64px; }
  .card { padding: 20px; }
  .timeline-grid { grid-template-columns: 1fr; }
}
</style>
</head>
