<!DOCTYPE html>
<html lang="en">
<head>
<!-- Microsoft Clarity -->
<script type="text/javascript">

        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x5l2gaeiwc");

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — AI Lead Intel</title>
<meta name="robots" content="noindex" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#070708; --surface:#101013; --border:rgba(255,255,255,0.10); --text:#f4f4f5; --text-dim:#8b8b94; --brand:#ff6a00; --green:#34d399; --red:#f87171; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:34px 30px; }
  .mark { width:34px; height:34px; border-radius:9px; background:var(--brand); margin-bottom:20px; }
  h1 { font-size:23px; font-weight:700; letter-spacing:-0.02em; margin-bottom:8px; }
  p.sub { font-size:14px; color:var(--text-dim); line-height:1.6; margin-bottom:24px; }
  label { display:block; font-size:13px; color:var(--text-dim); margin-bottom:7px; font-weight:500; }
  input { width:100%; background:#08080a; border:1px solid var(--border); border-radius:10px; padding:13px 14px; color:var(--text); font-size:15px; font-family:inherit; margin-bottom:16px; }
  input:focus { outline:none; border-color:var(--brand); }
  button { width:100%; background:var(--brand); color:#0a0a0d; font-size:15px; font-weight:600; padding:14px; border:none; border-radius:10px; cursor:pointer; font-family:inherit; }
  button:disabled { opacity:0.55; cursor:not-allowed; }
  .msg { font-size:13.5px; padding:12px 14px; border-radius:10px; margin-bottom:18px; line-height:1.55; display:none; }
  .msg.err { display:block; background:rgba(248,113,113,0.12); border:1px solid rgba(248,113,113,0.3); color:var(--red); }
  .msg.ok { display:block; background:rgba(52,211,153,0.12); border:1px solid rgba(52,211,153,0.3); color:var(--green); }
  a { color:var(--brand); text-decoration:none; font-size:14px; }
  .foot { text-align:center; margin-top:18px; }
  .hidden { display:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"></div>
    <div id="msg" class="msg"></div>

    <div id="form-wrap">
      <h1>Set a new password</h1>
      <p class="sub">Choose a new password for your AI Lead Intel account.</p>
      <label for="pw">New password</label>
      <input type="password" id="pw" placeholder="At least 8 characters" autocomplete="new-password" />
      <label for="pw2">Confirm new password</label>
      <input type="password" id="pw2" placeholder="Re-enter password" autocomplete="new-password" />
      <button id="save" type="button">Update password</button>
    </div>

    <div id="expired-wrap" class="hidden">
      <h1>Reset link expired</h1>
      <p class="sub">This password reset link is invalid or has expired. Reset links work once and only for a short time. Please request a new one from the sign-in page.</p>
      <a href="/sign-in">← Back to sign in</a>
    </div>

    <div class="foot"><a href="/sign-in">Back to sign in</a></div>
  </div>

<script>
const SUPABASE_URL = 'https://mbrhkeddgmywqqgdfdgx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__YkhmAu61Nr8VetJS8pJqA_MHrmO69t';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const msg = document.getElementById('msg');
const formWrap = document.getElementById('form-wrap');
const expiredWrap = document.getElementById('expired-wrap');
const saveBtn = document.getElementById('save');

function show(el){ el.classList.remove('hidden'); }
function hide(el){ el.classList.add('hidden'); }
function setMsg(text, kind){ msg.textContent = text; msg.className = 'msg ' + kind; }

// The recovery link establishes a temporary session. Confirm we actually have
// one before letting the user set a new password.
let hasRecovery = false;

supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY' || (session && session.user)) {
    hasRecovery = true;
  }
});

(async function init(){
  // Give Supabase a moment to parse the token from the URL.
  await new Promise(r => setTimeout(r, 600));
  const { data: { session } } = await supabase.auth.getSession();
  if (session && session.user) {
    hasRecovery = true;
  }
  if (!hasRecovery) {
    hide(formWrap);
    show(expiredWrap);
  }
})();

saveBtn.addEventListener('click', async () => {
  const pw = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  if (pw.length < 8) { setMsg('Password must be at least 8 characters.', 'err'); return; }
  if (pw !== pw2) { setMsg('The two passwords don\u2019t match.', 'err'); return; }

  saveBtn.disabled = true;
  saveBtn.textContent = 'Updating\u2026';
  try {
    const { error } = await supabase.auth.updateUser({ password: pw });
    if (error) {
      setMsg(error.message || 'Could not update password. Your reset link may have expired — request a new one.', 'err');
      saveBtn.disabled = false;
      saveBtn.textContent = 'Update password';
      return;
    }
    setMsg('Password updated. Redirecting you to sign in\u2026', 'ok');
    hide(formWrap);
    await supabase.auth.signOut();
    setTimeout(() => window.location.assign('/sign-in'), 1800);
  } catch (e) {
    setMsg('Something went wrong. Please try again.', 'err');
    saveBtn.disabled = false;
    saveBtn.textContent = 'Update password';
  }
});
</script>
</body>
</html>
