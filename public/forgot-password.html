<!DOCTYPE html>
<html lang="en">
<head>
<!-- Microsoft Clarity -->
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x5l2gaeiwc");
</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password — AI Lead Intel</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#070708; --surface:#101013; --border:rgba(255,255,255,0.10); --text:#f4f4f5; --text-dim:#8b8b94; --brand:#ff6a00; --green:#34d399; --red:#f87171; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:34px 30px; }
  .mark { width:34px; height:34px; border-radius:9px; background:var(--brand); margin-bottom:20px; }
  h1 { font-size:23px; font-weight:700; letter-spacing:-0.02em; margin-bottom:8px; }
  p.sub { font-size:14px; color:var(--text-dim); line-height:1.6; margin-bottom:24px; }
  label { display:block; font-size:13px; color:var(--text-dim); margin-bottom:7px; font-weight:500; }
  input { width:100%; background:#08080a; border:1px solid var(--border); border-radius:10px; padding:13px 14px; color:var(--text); font-size:15px; font-family:inherit; margin-bottom:16px; }
  input:focus { outline:none; border-color:var(--brand); }
  button { width:100%; background:var(--brand); color:#0a0a0d; font-size:15px; font-weight:600; padding:14px; border:none; border-radius:10px; cursor:pointer; font-family:inherit; }
  button:disabled { opacity:0.55; cursor:not-allowed; }
  .msg { font-size:13.5px; padding:12px 14px; border-radius:10px; margin-bottom:18px; line-height:1.55; display:none; }
  .msg.ok { display:block; background:rgba(52,211,153,0.12); border:1px solid rgba(52,211,153,0.3); color:var(--green); }
  .msg.err { display:block; background:rgba(248,113,113,0.12); border:1px solid rgba(248,113,113,0.3); color:var(--red); }
  a { color:var(--brand); text-decoration:none; font-size:14px; }
  .foot { text-align:center; margin-top:18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"></div>
    <div id="msg" class="msg"></div>
    <h1>Forgot your password?</h1>
    <p class="sub">Enter your account email and we'll send you a link to set a new password.</p>
    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="you@business.com" autocomplete="email" />
    <button id="send" type="button">Send reset link</button>
    <div class="foot"><a href="/sign-in">Back to sign in</a></div>
  </div>
<script>
const msg = document.getElementById('msg');
const sendBtn = document.getElementById('send');
function setMsg(t, k){ msg.textContent = t; msg.className = 'msg ' + k; }

sendBtn.addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  if (!email || !email.includes('@')) { setMsg('Please enter a valid email address.', 'err'); return; }
  sendBtn.disabled = true;
  sendBtn.textContent = 'Sending\u2026';
  try {
    await fetch('/api/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    setMsg('If that email has an account, a reset link is on its way. Check your inbox (and spam).', 'ok');
  } catch (e) {
    setMsg('Something went wrong. Please try again in a moment.', 'err');
    sendBtn.disabled = false;
    sendBtn.textContent = 'Send reset link';
    return;
  }
  sendBtn.textContent = 'Sent';
});
</script>
</body>
</html>
