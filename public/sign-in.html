<!DOCTYPE html>
<html lang="en">
<head>

<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sign in · AI Lead Intel</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #08080a;
  --surface: #111114; --surface-2: #16161b; --surface-3: #1c1c22; --surface-input: #0d0d10;
  --border: rgba(255,255,255,0.06); --border-2: rgba(255,255,255,0.10); --border-3: rgba(255,255,255,0.14);
  --text: #fafafa; --text-soft: #d4d4d8; --text-dim: #a1a1aa; --text-faint: #71717a; --text-muted: #52525b;
  --brand: #ff6a00; --brand-2: #ff9a00; --brand-3: #ff8533;
  --brand-glow: rgba(255,106,0,0.32); --brand-soft: rgba(255,106,0,0.10);
  --brand-tint: rgba(255,106,0,0.05); --brand-line: rgba(255,106,0,0.22);
  --green: #34d399; --green-soft: rgba(52,211,153,0.10); --green-line: rgba(52,211,153,0.28);
  --hot: #ef4444; --hot-soft: rgba(239,68,68,0.10); --hot-line: rgba(239,68,68,0.28);
}
html, body { height: 100%; }
body { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; letter-spacing: -0.011em; -webkit-font-smoothing: antialiased; }
body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(255,106,0,0.10), transparent 60%); pointer-events: none; z-index: 0; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; outline: none; }
.topnav { position: relative; z-index: 100; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(8,8,10,0.7); backdrop-filter: blur(20px); }
.logo { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.logo-mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: 0 0 18px var(--brand-glow), inset 0 1px 0 rgba(255,255,255,0.25); }
.support-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; background: var(--surface-2); border: 1px solid var(--border-2); border-radius: 99px; font-size: 12px; color: var(--text-dim); font-weight: 500; }
@media (max-width: 720px) { .topnav { padding: 12px 16px; } }
.wrap { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; padding: 64px 24px 80px; }
.hero { text-align: center; margin-bottom: 28px; }
.hero-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--brand); background: var(--brand-soft); border: 1px solid var(--brand-line); padding: 6px 14px; border-radius: 99px; font-weight: 600; margin-bottom: 18px; }
.hero-eyebrow .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 8px var(--brand-glow); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.7); } }
.hero-title { font-size: clamp(28px, 4vw, 36px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 12px; }
.hero-title .accent { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; background: linear-gradient(135deg, var(--brand), var(--brand-2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hero-sub { font-size: 14.5px; color: var(--text-dim); line-height: 1.55; max-width: 360px; margin: 0 auto; }
.card { background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%); border: 1px solid var(--border); border-radius: 18px; padding: 32px; box-shadow: 0 24px 60px rgba(0,0,0,0.45); position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--brand-line), transparent); }
.field { margin-bottom: 14px; }
.field:last-of-type { margin-bottom: 20px; }
.float-wrap { position: relative; }
.float-input { width: 100%; padding: 22px 16px 10px; background: var(--surface-input); border: 1px solid var(--border-2); border-radius: 12px; color: var(--text); font-size: 15px; transition: border-color 0.18s, box-shadow 0.18s, background 0.18s; font-weight: 500; }
.float-input:hover { border-color: var(--border-3); }
.float-input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-tint); background: #0c0c0f; }
.float-label { position: absolute; left: 16px; top: 18px; font-size: 14px; color: var(--text-faint); pointer-events: none; transition: all 0.18s cubic-bezier(0.16,1,0.3,1); font-weight: 500; }
.float-input:focus ~ .float-label, .float-input:not(:placeholder-shown) ~ .float-label, .float-input:-webkit-autofill ~ .float-label { top: 8px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brand); font-weight: 600; }
.float-input:-webkit-autofill { -webkit-text-fill-color: var(--text) !important; -webkit-box-shadow: 0 0 0 1000px var(--surface-input) inset !important; caret-color: var(--text); }
.forgot-row { display: flex; justify-content: flex-end; margin: -6px 0 16px; }
.forgot-link { font-size: 12.5px; color: var(--text-dim); transition: color 0.15s; cursor: pointer; background: none; border: none; padding: 4px; font-family: inherit; }
.forgot-link:hover { color: var(--brand); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 20px; border-radius: 11px; font-size: 14px; font-weight: 600; transition: all 0.2s cubic-bezier(0.16,1,0.3,1); border: 1px solid transparent; cursor: pointer; min-height: 46px; }
.btn-primary { background: linear-gradient(135deg, var(--brand), var(--brand-3)); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 4px 14px var(--brand-glow); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), 0 10px 26px var(--brand-glow); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.form-msg { display: none; align-items: center; gap: 9px; padding: 11px 14px; border-radius: 11px; font-size: 13px; font-weight: 500; margin-bottom: 16px; line-height: 1.4; }
.form-msg.visible { display: flex; }
.form-msg svg { flex-shrink: 0; }
.form-msg.error { background: var(--hot-soft); border: 1px solid var(--hot-line); color: var(--hot); }
.form-msg.success { background: var(--green-soft); border: 1px solid var(--green-line); color: var(--green); }
.form-msg.info { background: var(--brand-tint); border: 1px solid var(--brand-line); color: var(--brand); }
.help-line { font-size: 12px; color: var(--text-faint); text-align: center; margin-top: 14px; line-height: 1.55; }
.help-line a { color: var(--brand); font-weight: 500; }
.bottom-link { text-align: center; margin-top: 22px; font-size: 13px; color: var(--text-faint); }
.bottom-link a { color: var(--brand); font-weight: 500; }
.forgot-card { display: none; }
.forgot-card.visible { display: block; }
.signin-card.hidden { display: none; }
</style>
</head>
<body>
<nav class="topnav">
  <a href="/" class="logo"><div class="logo-mark"></div><span>AI Lead Intel</span></a>
  <a href="mailto:hello@aileadintel.com" class="support-pill">Support</a>
</nav>
<div class="wrap">
  <header class="hero">
    <div class="hero-eyebrow"><span class="dot"></span>Account access</div>
    <h1 class="hero-title">Sign in to your <span class="accent">dashboard</span></h1>
    <p class="hero-sub">Use the email and password you set up after payment.</p>
  </header>
  <!-- SIGN IN CARD -->
  <div class="card signin-card" id="signin-card">
    <div class="form-msg" id="signin-msg">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="signin-msg-text"></span>
    </div>
    <div class="field">
      <div class="float-wrap">
        <input type="email" id="signin-email" class="float-input" placeholder=" " autocomplete="email" />
        <label class="float-label" for="signin-email">Email</label>
      </div>
    </div>
    <div class="field">
      <div class="float-wrap">
        <input type="password" id="signin-password" class="float-input" placeholder=" " autocomplete="current-password" />
        <label class="float-label" for="signin-password">Password</label>
      </div>
    </div>
    <div class="forgot-row">
      <button class="forgot-link" type="button" id="show-forgot">Forgot password?</button>
    </div>
    <button class="btn btn-primary" id="signin-btn" type="button">
      <span id="signin-label">Sign in</span>
    </button>
    <div class="help-line">Just paid and need to set up? <a href="/create-password">Create your password</a></div>
  </div>
  <!-- FORGOT PASSWORD CARD -->
  <div class="card forgot-card" id="forgot-card">
    <div class="form-msg" id="forgot-msg">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="forgot-msg-text"></span>
    </div>
    <div class="field">
      <div class="float-wrap">
        <input type="email" id="forgot-email" class="float-input" placeholder=" " autocomplete="email" />
        <label class="float-label" for="forgot-email">Your email</label>
      </div>
    </div>
    <button class="btn btn-primary" id="forgot-btn" type="button">
      <span id="forgot-label">Send reset link</span>
    </button>
    <div class="help-line">We'll email you a link to set a new password.</div>
    <div class="bottom-link"><button class="forgot-link" type="button" id="back-to-signin" style="color:var(--brand);">← Back to sign in</button></div>
  </div>
  <div class="bottom-link"><a href="/">← Back to homepage</a></div>
</div>
<script>
'use strict';
const SUPABASE_URL = 'https://mbrhkeddgmywqqgdfdgx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__YkhmAu61Nr8VetJS8pJqA_MHrmO69t';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// Prefill email from URL params
const urlParams = new URLSearchParams(window.location.search);
const prefillEmail = (urlParams.get('email') || '').trim();
const justCreated = urlParams.get('just_created') === '1';
if (prefillEmail) document.getElementById('signin-email').value = prefillEmail;
if (justCreated) {
  showMsg('signin-msg', 'info', 'Account created. Sign in with the password you just set.');
}
// If already signed in, route them appropriately
(async function checkExistingSession() {
  const { data } = await supabase.auth.getSession();
  if (data && data.session) {
    console.log('[signin] existing session — redirecting');
    await routeUserAfterSignIn();
  }
})();
function showMsg(id, type, text) {
  const el = document.getElementById(id);
  const txt = document.getElementById(id + '-text');
  el.classList.remove('error', 'success', 'info');
  el.classList.add(type, 'visible');
  txt.textContent = text;
}
function hideMsg(id) { document.getElementById(id).classList.remove('visible'); }
async function lookupClientForCurrentUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) return null;
  const { data: rows, error } = await supabase
    .from('clients')
    .select('client_slug, plan, business_name, setup_complete')
    .eq('owner_user_id', session.user.id)
    .limit(1);
  if (error) {
    console.error('[signin] client lookup error:', error);
    return null;
  }
  return rows && rows[0] ? rows[0] : null;
}
async function routeUserAfterSignIn() {
  const client = await lookupClientForCurrentUser();
  if (!client || !client.client_slug) {
    showMsg('signin-msg', 'error', 'Signed in, but we couldn\'t find your account. Email support.');
    return;
  }
  const plan = (client.plan || '').toLowerCase();
  // Starter users manage everything from their Settings/account page.
  if (plan === 'starter') {
    window.location.assign('/account');
    return;
  }
  // Pro — gate on setup_complete
  if (client.setup_complete !== true) {
    window.location.assign('/setup');
    return;
  }
  window.location.assign('/dashboard/' + encodeURIComponent(client.client_slug));
}
// SIGN IN
const signinBtn = document.getElementById('signin-btn');
const signinLabel = document.getElementById('signin-label');
let signinBusy = false;
signinBtn.addEventListener('click', async () => {
  if (signinBusy) return;
  hideMsg('signin-msg');
  const email = document.getElementById('signin-email').value.trim().toLowerCase();
  const password = document.getElementById('signin-password').value;
  if (!email || !email.includes('@')) { showMsg('signin-msg', 'error', 'Please enter a valid email.'); return; }
  if (!password) { showMsg('signin-msg', 'error', 'Please enter your password.'); return; }
  signinBusy = true;
  signinBtn.disabled = true;
  signinLabel.innerHTML = '<span class="spinner"></span>';
  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      console.error('[signin] error:', error.message);
      let msg = 'Wrong email or password. Try again.';
      if (error.message && error.message.toLowerCase().includes('email not confirmed')) {
        msg = 'Your email isn\'t confirmed yet. Check your inbox.';
      }
      showMsg('signin-msg', 'error', msg);
      signinBusy = false;
      signinBtn.disabled = false;
      signinLabel.textContent = 'Sign in';
      return;
    }
    showMsg('signin-msg', 'success', 'Signed in — opening your account…');
    setTimeout(routeUserAfterSignIn, 500);
  } catch (err) {
    console.error('[signin] exception:', err);
    showMsg('signin-msg', 'error', 'Network error. Please try again.');
    signinBusy = false;
    signinBtn.disabled = false;
    signinLabel.textContent = 'Sign in';
  }
});
// Submit on Enter
document.querySelectorAll('#signin-card .float-input').forEach(input => {
  input.addEventListener('keydown', e => { if (e.key === 'Enter') signinBtn.click(); });
});
// FORGOT PASSWORD
const showForgotBtn = document.getElementById('show-forgot');
const backToSigninBtn = document.getElementById('back-to-signin');
const signinCard = document.getElementById('signin-card');
const forgotCard = document.getElementById('forgot-card');
showForgotBtn.addEventListener('click', () => {
  signinCard.classList.add('hidden');
  forgotCard.classList.add('visible');
  const email = document.getElementById('signin-email').value.trim();
  if (email) document.getElementById('forgot-email').value = email;
  hideMsg('forgot-msg');
});
backToSigninBtn.addEventListener('click', () => {
  forgotCard.classList.remove('visible');
  signinCard.classList.remove('hidden');
});
const forgotBtn = document.getElementById('forgot-btn');
const forgotLabel = document.getElementById('forgot-label');
let forgotBusy = false;
forgotBtn.addEventListener('click', async () => {
  if (forgotBusy) return;
  hideMsg('forgot-msg');
  const email = document.getElementById('forgot-email').value.trim().toLowerCase();
  if (!email || !email.includes('@')) { showMsg('forgot-msg', 'error', 'Please enter a valid email.'); return; }
  forgotBusy = true;
  forgotBtn.disabled = true;
  forgotLabel.innerHTML = '<span class="spinner"></span>';
  try {
    // Sends the reset email from hello@aileadintel.com (our own flow), not Supabase.
    await fetch('/api/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    // Always show success (don't leak which emails exist)
    showMsg('forgot-msg', 'success', 'If an account exists for that email, a reset link is on its way.');
    setTimeout(() => {
      forgotBusy = false;
      forgotBtn.disabled = false;
      forgotLabel.textContent = 'Send reset link';
    }, 2000);
  } catch (err) {
    console.error('[forgot] exception:', err);
    showMsg('forgot-msg', 'error', 'Network error. Please try again.');
    forgotBusy = false;
    forgotBtn.disabled = false;
    forgotLabel.textContent = 'Send reset link';
  }
});
document.querySelectorAll('#forgot-card .float-input').forEach(input => {
  input.addEventListener('keydown', e => { if (e.key === 'Enter') forgotBtn.click(); });
});
</script>
</body>
</html>
