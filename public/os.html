<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AI Lead Intel OS — Operating System</title>
<meta name="description" content="Live operating system map of AI Lead Intel. Every component, integration, and page visualized as a neural network." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #04050a; --bg-2: #07080e; --bg-3: #0a0c14;
  --surface: #0d0f17; --surface-2: #11141d; --surface-3: #161a24;
  --border: rgba(255,255,255,0.06); --border-2: rgba(255,255,255,0.10); --border-3: rgba(255,255,255,0.16);
  --text: #f5f7fa; --text-soft: #c8cdd6; --text-dim: #8a92a3; --text-faint: #5a6173; --text-muted: #3d4252;
  --brand: #ff6a00; --brand-2: #ff9a00; --brand-3: #ff8533;
  --brand-glow: rgba(255,106,0,0.35); --brand-soft: rgba(255,106,0,0.12);
  --brand-line: rgba(255,106,0,0.28);
  --cyan: #00d4ff; --cyan-soft: rgba(0,212,255,0.12); --cyan-line: rgba(0,212,255,0.32);
  --violet: #a78bfa; --violet-soft: rgba(167,139,250,0.12); --violet-line: rgba(167,139,250,0.32);
  --green: #34d399; --green-soft: rgba(52,211,153,0.12); --green-line: rgba(52,211,153,0.32);
  --pink: #f472b6; --pink-soft: rgba(244,114,182,0.12); --pink-line: rgba(244,114,182,0.32);
  --amber: #fbbf24; --amber-soft: rgba(251,191,36,0.12); --amber-line: rgba(251,191,36,0.32);
  --red: #f87171; --red-soft: rgba(248,113,113,0.12); --red-line: rgba(248,113,113,0.32);
}
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg); color: var(--text);
  letter-spacing: -0.01em; -webkit-font-smoothing: antialiased;
  position: relative;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255,106,0,0.08), transparent 60%),
    radial-gradient(ellipse 40% 30% at 20% 80%, rgba(0,212,255,0.05), transparent 60%),
    radial-gradient(ellipse 40% 30% at 80% 20%, rgba(167,139,250,0.05), transparent 60%);
}
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
}

/* ====== TOP BAR ====== */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 22px; gap: 16px;
  background: linear-gradient(180deg, rgba(8,10,16,0.92), rgba(8,10,16,0.72));
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  border-bottom: 1px solid var(--border);
}
.topbar::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,106,0,0.4), transparent);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: 0 0 18px var(--brand-glow), inset 0 1px 0 rgba(255,255,255,0.25); position: relative; overflow: hidden; flex-shrink: 0; }
.brand-mark::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,0.22)); }
.brand-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.brand-title { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-family: 'Geist Mono', monospace; font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--brand); font-weight: 600; }
.live-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: 99px;
  background: var(--green-soft); border: 1px solid var(--green-line);
  font-family: 'Geist Mono', monospace; font-size: 9.5px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--green);
  flex-shrink: 0;
}
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: livePulse 1.6s ease-in-out infinite; }
@keyframes livePulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.65); } }
.search-wrap { flex: 1; max-width: 420px; position: relative; }
.search-input {
  width: 100%; padding: 9px 14px 9px 36px; border-radius: 10px;
  background: var(--surface-2); border: 1px solid var(--border-2);
  color: var(--text); font-family: inherit; font-size: 13px; font-weight: 500;
  outline: none; transition: all 0.18s;
}
.search-input::placeholder { color: var(--text-faint); }
.search-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); background: var(--surface-3); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
.search-kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-family: 'Geist Mono', monospace; font-size: 9px; color: var(--text-faint); border: 1px solid var(--border-2); padding: 2px 6px; border-radius: 4px; pointer-events: none; }
.topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.tb-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border-2); color: var(--text-soft); font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
.tb-btn:hover { background: var(--surface-3); color: var(--text); border-color: var(--border-3); }
.tb-btn svg { color: var(--text-faint); }
.tb-btn:hover svg { color: var(--brand); }

/* ====== FILTER RAIL ====== */
.filter-rail {
  position: fixed; top: 70px; left: 0; right: 0; z-index: 40;
  display: flex; gap: 6px; padding: 12px 22px;
  background: linear-gradient(180deg, rgba(8,10,16,0.85), transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  overflow-x: auto; scrollbar-width: none;
}
.filter-rail::-webkit-scrollbar { display: none; }
.filter-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 11px; border-radius: 99px;
  background: var(--surface-2); border: 1px solid var(--border-2);
  font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 600;
  color: var(--text-dim); letter-spacing: 0.06em; cursor: pointer;
  transition: all 0.15s; white-space: nowrap; flex-shrink: 0;
}
.filter-chip:hover { background: var(--surface-3); color: var(--text); }
.filter-chip.active { background: var(--brand-soft); border-color: var(--brand-line); color: var(--brand); }
.filter-chip-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

/* ====== GRAPH CANVAS ====== */
.graph-stage {
  position: fixed; inset: 120px 0 0 0; z-index: 1;
  overflow: hidden;
  cursor: grab;
}
.graph-stage.dragging { cursor: grabbing; }
.graph-svg {
  width: 100%; height: 100%;
  display: block;
}

/* Edges */
.edge-line {
  stroke: rgba(255,255,255,0.07);
  stroke-width: 1;
  fill: none;
  transition: stroke 0.2s, stroke-width 0.2s, opacity 0.3s;
}
.edge-line.active {
  stroke: rgba(255,106,0,0.5);
  stroke-width: 1.5;
}
.edge-line.dimmed { opacity: 0.15; }

.edge-pulse {
  stroke-width: 2;
  fill: none;
  stroke-dasharray: 3 200;
  stroke-linecap: round;
  pointer-events: none;
  opacity: 0.85;
}

/* Nodes */
.node-group { cursor: pointer; transition: opacity 0.3s; }
.node-group.dimmed { opacity: 0.18; }
.node-group:hover .node-circle-bg { filter: brightness(1.3); }
.node-group:hover .node-circle-outer { stroke-opacity: 1; }
.node-circle-outer {
  fill: none; stroke-width: 1.5;
  transition: stroke-width 0.2s, stroke-opacity 0.2s;
  stroke-opacity: 0.55;
}
.node-circle-bg {
  transition: filter 0.2s;
}
.node-icon-wrap {
  pointer-events: none;
}
.node-label {
  font-family: 'Geist', sans-serif;
  font-weight: 600;
  font-size: 11px;
  fill: var(--text-soft);
  text-anchor: middle;
  pointer-events: none;
  letter-spacing: -0.01em;
}
.node-label-sub {
  font-family: 'Geist Mono', monospace;
  font-size: 8.5px;
  fill: var(--text-faint);
  text-anchor: middle;
  letter-spacing: 0.08em;
  pointer-events: none;
}
.node-group.center .node-label { font-size: 13px; font-weight: 700; fill: var(--text); }
.node-group.cluster .node-label { font-size: 12px; font-weight: 700; fill: var(--text); }
.node-group.selected .node-circle-outer { stroke-width: 2.5; stroke-opacity: 1; }
.node-group.selected .node-circle-bg { filter: brightness(1.4); }

/* Ring pulse on center */
.center-ring {
  fill: none;
  stroke: rgba(255,106,0,0.4);
  stroke-width: 1;
  opacity: 0;
  animation: centerRing 3.2s ease-out infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.center-ring:nth-child(2) { animation-delay: 1.05s; }
.center-ring:nth-child(3) { animation-delay: 2.1s; }
@keyframes centerRing {
  0% { transform: scale(0.7); opacity: 0.7; }
  100% { transform: scale(2.4); opacity: 0; }
}

/* ====== ZOOM CONTROLS ====== */
.zoom-controls {
  position: fixed; bottom: 24px; left: 24px; z-index: 30;
  display: flex; flex-direction: column; gap: 4px;
  background: var(--surface); border: 1px solid var(--border-2);
  border-radius: 10px; padding: 4px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  backdrop-filter: blur(12px);
}
.zoom-btn {
  width: 34px; height: 34px; border-radius: 7px;
  background: transparent; color: var(--text-dim);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.15s; border: none;
}
.zoom-btn:hover { background: var(--surface-3); color: var(--text); }
.zoom-btn:active { transform: scale(0.92); }
.zoom-level {
  font-family: 'Geist Mono', monospace; font-size: 9.5px; font-weight: 600;
  color: var(--text-faint); text-align: center; padding: 3px 0;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  letter-spacing: 0.04em;
}

/* ====== MINIMAP ====== */
.minimap {
  position: fixed; bottom: 24px; right: 24px; z-index: 30;
  width: 200px; height: 140px;
  background: var(--surface); border: 1px solid var(--border-2);
  border-radius: 10px; overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  backdrop-filter: blur(12px);
}
.minimap-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px; border-bottom: 1px solid var(--border);
  font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 600;
  color: var(--text-faint); letter-spacing: 0.14em; text-transform: uppercase;
}
.minimap-svg {
  width: 100%; height: calc(100% - 26px);
  background: var(--bg-2);
}
.minimap-viewport {
  fill: rgba(255,106,0,0.1);
  stroke: var(--brand);
  stroke-width: 1;
  pointer-events: none;
}
.minimap-dot { fill: var(--text-faint); }
.minimap-dot.center { fill: var(--brand); }
.minimap-dot.cluster { fill: var(--cyan); }

/* ====== DETAIL PANEL ====== */
.detail-panel {
  position: fixed; top: 120px; right: 0; bottom: 0; width: 380px;
  z-index: 35;
  background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
  border-left: 1px solid var(--border-2);
  transform: translateX(100%);
  transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
  overflow-y: auto;
  display: flex; flex-direction: column;
  box-shadow: -16px 0 48px rgba(0,0,0,0.5);
}
.detail-panel.open { transform: translateX(0); }
.detail-panel::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--brand), transparent);
}
.detail-head { padding: 22px 22px 18px; border-bottom: 1px solid var(--border); position: relative; }
.detail-close {
  position: absolute; top: 18px; right: 18px; width: 30px; height: 30px;
  border-radius: 8px; background: var(--surface-3); border: 1px solid var(--border-2);
  color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.detail-close:hover { background: var(--surface); color: var(--text); border-color: var(--border-3); }
.detail-icon-wrap {
  width: 52px; height: 52px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px;
  position: relative; overflow: hidden;
}
.detail-icon-wrap::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,0.18));
}
.detail-category {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Geist Mono', monospace; font-size: 9.5px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 99px;
  margin-bottom: 10px;
}
.detail-title { font-size: 22px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; margin-bottom: 6px; }
.detail-url {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--brand-2);
  text-decoration: none; padding: 4px 0; word-break: break-all;
}
.detail-url:hover { color: var(--brand); }
.detail-url svg { flex-shrink: 0; }

.detail-section { padding: 18px 22px; border-bottom: 1px solid var(--border); }
.detail-section:last-child { border-bottom: none; padding-bottom: 32px; }
.detail-section-title {
  font-family: 'Geist Mono', monospace; font-size: 9.5px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-faint);
  margin-bottom: 10px;
}
.detail-text { font-size: 13.5px; color: var(--text-soft); line-height: 1.6; }
.detail-text strong { color: var(--text); font-weight: 600; }

.status-row { display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.status-dot.operational { background: var(--green); box-shadow: 0 0 8px var(--green); animation: livePulse 1.8s ease-in-out infinite; }
.status-dot.partial { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
.status-dot.degraded { background: var(--red); box-shadow: 0 0 8px var(--red); }
.status-text { font-size: 13px; font-weight: 600; color: var(--text); }
.status-meta { font-family: 'Geist Mono', monospace; font-size: 10px; color: var(--text-faint); margin-left: auto; }

.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.metric-card {
  background: var(--surface-3); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px;
}
.metric-label { font-family: 'Geist Mono', monospace; font-size: 8.5px; font-weight: 600; color: var(--text-faint); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
.metric-value { font-family: 'Geist Mono', monospace; font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; line-height: 1; }
.metric-sub { font-size: 10px; color: var(--text-faint); margin-top: 3px; font-family: 'Geist Mono', monospace; }
.metric-sub.up { color: var(--green); }

.connection-list { display: flex; flex-direction: column; gap: 6px; }
.connection-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px;
  background: var(--surface-3); border: 1px solid var(--border);
  cursor: pointer; transition: all 0.15s;
}
.connection-item:hover { background: var(--surface); border-color: var(--border-3); }
.connection-item-icon {
  width: 24px; height: 24px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.connection-item-name { font-size: 12.5px; font-weight: 500; color: var(--text); flex: 1; }
.connection-item-arrow { color: var(--text-faint); flex-shrink: 0; }

/* ====== EMPTY HINT ====== */
.empty-hint {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 25;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-radius: 99px;
  background: var(--surface); border: 1px solid var(--border-2);
  font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500;
  color: var(--text-dim); letter-spacing: 0.04em;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  pointer-events: none;
  animation: hintFade 6s ease-in-out forwards;
}
@keyframes hintFade {
  0% { opacity: 0; transform: translate(-50%, 10px); }
  10% { opacity: 1; transform: translate(-50%, 0); }
  85% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -10px); pointer-events: none; visibility: hidden; }
}
.empty-hint .pip { width: 5px; height: 5px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 6px var(--brand-glow); }

/* Mobile */
@media (max-width: 720px) {
  .topbar { padding: 10px 14px; gap: 10px; }
  .brand-text { display: none; }
  .search-wrap { max-width: none; }
  .topbar-right .tb-btn span { display: none; }
  .filter-rail { padding: 10px 14px; top: 60px; }
  .graph-stage { inset: 108px 0 0 0; }
  .detail-panel { width: 100%; top: 108px; }
  .minimap { display: none; }
  .zoom-controls { bottom: 14px; left: 14px; }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-text">
      <div class="brand-title">AI Lead Intel</div>
      <div class="brand-sub">Operating System</div>
    </div>
  </div>
  <div class="live-pill"><span class="live-dot"></span>System Online</div>
  <div class="search-wrap">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" id="search-input" placeholder="Search nodes, integrations, pages…" />
    <span class="search-kbd">⌘ K</span>
  </div>
  <div class="topbar-right">
    <button class="tb-btn" id="btn-reset" title="Reset view">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      <span>Reset</span>
    </button>
    <a class="tb-btn" href="/" title="Back to site">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2z"/></svg>
      <span>Home</span>
    </a>
  </div>
</div>

<!-- FILTER RAIL -->
<div class="filter-rail" id="filter-rail"></div>

<!-- GRAPH -->
<div class="graph-stage" id="graph-stage">
  <svg class="graph-svg" id="graph-svg" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<!-- ZOOM CONTROLS -->
<div class="zoom-controls">
  <button class="zoom-btn" id="zoom-in" title="Zoom in">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <div class="zoom-level" id="zoom-level">100%</div>
  <button class="zoom-btn" id="zoom-out" title="Zoom out">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <button class="zoom-btn" id="zoom-fit" title="Fit to screen">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9V5a2 2 0 0 1 2-2h4"/><path d="M21 9V5a2 2 0 0 0-2-2h-4"/><path d="M21 15v4a2 2 0 0 1-2 2h-4"/><path d="M3 15v4a2 2 0 0 0 2 2h4"/></svg>
  </button>
</div>

<!-- MINIMAP -->
<div class="minimap">
  <div class="minimap-header">
    <span>Minimap</span>
    <span style="color:var(--brand)">●</span>
  </div>
  <svg class="minimap-svg" id="minimap-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 114" preserveAspectRatio="xMidYMid meet"></svg>

function deg2rad(d) { return d * Math.PI / 180; }
function placeAround(cx, cy, radius, angle) {
  return { x: cx + Math.cos(deg2rad(angle)) * radius, y: cy + Math.sin(deg2rad(angle)) * radius };
}

CLUSTERS.forEach(cluster => {
  const pos = placeAround(0, 0, cluster.radius, cluster.angle);
  const clusterNode = {
    id: cluster.id, x: pos.x, y: pos.y, r: 36, cat: cluster.cat, icon: cluster.icon,

const stage = document.getElementById('graph-stage');
const svg = document.getElementById('graph-svg');
const minimapSvg = document.getElementById('minimap-svg');

const VIEW = { x: 0, y: 0, k: 1, w: 0, h: 0 };

function setSvgViewBox() {
  const rect = stage.getBoundingClientRect();
  VIEW.w = rect.width; VIEW.h = rect.height;
  const vbW = VIEW.w / VIEW.k;
  const vbH = VIEW.h / VIEW.k;
  const minX = -vbW / 2 + VIEW.x;
  const minY = -vbH / 2 + VIEW.y;
  svg.setAttribute('viewBox', `${minX} ${minY} ${vbW} ${vbH}`);
  updateMinimapViewport(minX, minY, vbW, vbH);
}

function buildIconSvg(iconName, color) {
  const d = ICONS[iconName] || ICONS.bolt;
  return `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
}

function renderEdges() {
  let html = '';
  EDGES.forEach((e, i) => {
    const a = NODE_BY_ID[e.from], b = NODE_BY_ID[e.to];
    if (!a || !b) return;
    html += `<line class="edge-line" data-edge="${e.from}__${e.to}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" />`;
  });
  return html;
}

function renderCenterRings() {
  return `
    <circle class="center-ring" cx="0" cy="0" r="56"></circle>
    <circle class="center-ring" cx="0" cy="0" r="56"></circle>
    <circle class="center-ring" cx="0" cy="0" r="56"></circle>
  `;
}

function renderPulses() {
  // Animated pulse lines along select edges
  let html = '<g id="pulse-group">';
  // We'll animate via JS by moving small circles along chosen edges
  return html + '</g>';
}

function renderNodes() {
  let html = '';
  NODES.forEach(n => {
    const cat = CATEGORIES[n.cat] || CATEGORIES.core;
    const isCenter = n.id === 'center';
    const isCluster = n.isCluster;
    const iconColor = cat.color;
    const iconSize = isCenter ? 28 : (isCluster ? 22 : 14);
    const labelDy = n.r + 16;
    const sublabelDy = n.r + 28;
    const grp = `node-group ${isCenter ? 'center' : (isCluster ? 'cluster' : 'child')}`;

    html += `<g class="${grp}" data-id="${n.id}" transform="translate(${n.x},${n.y})">`;
    // Outer ring
    html += `<circle class="node-circle-outer" r="${n.r + 4}" stroke="${cat.color}" />`;
    // Glow
    html += `<circle class="node-circle-bg" r="${n.r}" fill="url(#grad-${n.cat})" filter="url(#glow-${n.cat})"/>`;
    // Solid inner
    html += `<circle r="${n.r - 4}" fill="rgba(8,10,16,0.85)" stroke="${cat.color}" stroke-opacity="0.4" stroke-width="1"/>`;
    // Icon
    html += `<g class="node-icon-wrap" transform="translate(${-iconSize/2},${-iconSize/2})">
      <foreignObject width="${iconSize}" height="${iconSize}">
        <div xmlns="http://www.w3.org/1999/xhtml" style="width:${iconSize}px;height:${iconSize}px;display:flex;align-items:center;justify-content:center;color:${iconColor}">
          ${buildIconSvg(n.icon, iconColor)}
        </div>
      </foreignObject>
    </g>`;
    // Label
    html += `<text class="node-label" y="${labelDy}">${escapeHtml(n.label)}</text>`;
    if (n.sublabel) {
      html += `<text class="node-label-sub" y="${sublabelDy}">${escapeHtml(n.sublabel)}</text>`;
    }
    html += `</g>`;
  });
  return html;
}

function renderDefs() {
  let defs = '<defs>';
  Object.keys(CATEGORIES).forEach(key => {
    const c = CATEGORIES[key];
    defs += `
      <radialGradient id="grad-${key}" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stop-color="${c.color}" stop-opacity="0.55"/>
        <stop offset="60%" stop-color="${c.color}" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="${c.color}" stop-opacity="0"/>
      </radialGradient>
      <filter id="glow-${key}" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    `;
  });
  defs += '</defs>';
  return defs;
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function paintGraph() {
  svg.innerHTML =
    renderDefs() +
    `<g id="edges-layer">${renderEdges()}</g>` +
    `<g id="pulses-layer"></g>` +
    `<g id="center-rings">${renderCenterRings()}</g>` +
    `<g id="nodes-layer">${renderNodes()}</g>`;
  attachNodeHandlers();
  setupPulses();
  setSvgViewBox();
  renderMinimap();
}

function attachNodeHandlers() {
  document.querySelectorAll('.node-group').forEach(g => {
    g.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = g.dataset.id;
      selectNode(id);
    });
  });
}

// ============================================================
// PULSES along edges
// ============================================================
function setupPulses() {
  const layer = document.getElementById('pulses-layer');
  if (!layer) return;
  layer.innerHTML = '';
  // Pick a handful of edges to animate continuously
  const pulseEdges = EDGES.filter(e =>
    e.from === 'center' ||
    e.to === 'center' ||
    (e.cross && Math.random() > 0.4)
  );
  pulseEdges.forEach((e, i) => {
    const a = NODE_BY_ID[e.from], b = NODE_BY_ID[e.to];
    if (!a || !b) return;
    const cat = CATEGORIES[NODE_BY_ID[e.to]?.cat] || CATEGORIES.core;
    const pulse = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    pulse.setAttribute('class', 'edge-pulse');
    pulse.setAttribute('x1', a.x);
    pulse.setAttribute('y1', a.y);
    pulse.setAttribute('x2', b.x);
    pulse.setAttribute('y2', b.y);
    pulse.setAttribute('stroke', cat.color);
    pulse.style.opacity = 0;
    layer.appendChild(pulse);

    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.sqrt(dx*dx + dy*dy);
    pulse.setAttribute('stroke-dasharray', `4 ${len}`);

    const dur = 1800 + Math.random() * 1600;
    const delay = i * 220 + Math.random() * 600;

    function animate() {
      pulse.animate([
        { strokeDashoffset: len, opacity: 0 },
        { opacity: 0.9, offset: 0.1 },
        { opacity: 0.9, offset: 0.85 },
        { strokeDashoffset: 0, opacity: 0 },
      ], { duration: dur, easing: 'linear' }).onfinish = () => {
        setTimeout(animate, 300 + Math.random() * 800);
      };
    }
    setTimeout(animate, delay);
  });
}

// ============================================================
// MINIMAP
// ============================================================
function renderMinimap() {
  // Compute bounds of all nodes
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  NODES.forEach(n => {
    if (n.x < minX) minX = n.x;
    if (n.x > maxX) maxX = n.x;
    if (n.y < minY) minY = n.y;
    if (n.y > maxY) maxY = n.y;
  });
  const padding = 60;
  minX -= padding; maxX += padding; minY -= padding; maxY += padding;
  const w = maxX - minX, h = maxY - minY;
  minimapSvg.setAttribute('viewBox', `${minX} ${minY} ${w} ${h}`);

  let html = '';
  EDGES.forEach(e => {
    const a = NODE_BY_ID[e.from], b = NODE_BY_ID[e.to];
    if (!a || !b) return;
    html += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>`;
  });
  NODES.forEach(n => {
    const cls = n.id === 'center' ? 'center' : (n.isCluster ? 'cluster' : '');
    const r = n.id === 'center' ? 8 : (n.isCluster ? 5 : 3);
    html += `<circle cx="${n.x}" cy="${n.y}" r="${r}" class="minimap-dot ${cls}"/>`;
  });
  html += `<rect class="minimap-viewport" id="minimap-vp" x="0" y="0" width="100" height="60"/>`;
  minimapSvg.innerHTML = html;
}

function updateMinimapViewport(minX, minY, vbW, vbH) {
  const vp = document.getElementById('minimap-vp');
  if (!vp) return;
  vp.setAttribute('x', minX);
  vp.setAttribute('y', minY);
  vp.setAttribute('width', vbW);
  vp.setAttribute('height', vbH);
}

// ============================================================
// SELECTION + DETAIL PANEL
// ============================================================
let selectedId = null;
const panel = document.getElementById('detail-panel');

function selectNode(id) {
  selectedId = id;
  const n = NODE_BY_ID[id];
  if (!n) return;

  document.querySelectorAll('.node-group').forEach(g => g.classList.remove('selected'));
  document.querySelector(`.node-group[data-id="${id}"]`)?.classList.add('selected');

  highlightConnections(id);

  const cat = CATEGORIES[n.cat] || CATEGORIES.core;

  // Icon
  const iconWrap = document.getElementById('detail-icon-wrap');
  iconWrap.style.background = `linear-gradient(135deg, ${cat.color}, ${shade(cat.color, -20)})`;
  iconWrap.style.boxShadow = `0 8px 24px ${cat.color}55`;
  iconWrap.innerHTML = `<div style="position:relative;z-index:1;color:#fff">${buildIconSvg(n.icon, '#fff').replace('<svg', '<svg width="22" height="22"')}</div>`;

  // Category badge
  const catEl = document.getElementById('detail-category');
  catEl.textContent = cat.label;
  catEl.style.background = cat.bgVar;
  catEl.style.borderColor = cat.lineVar;
  catEl.style.border = `1px solid ${cat.lineVar}`;
  catEl.style.color = cat.color;

  // Title + URL
  document.getElementById('detail-title').textContent = n.label;
  const urlEl = document.getElementById('detail-url');
  if (n.url) {
    urlEl.style.display = 'inline-flex';
    urlEl.href = n.url;
    document.getElementById('detail-url-text').textContent = n.url.replace(/^https?:\/\//, '');
  } else {
    urlEl.style.display = 'none';
  }

  // Status
  const statusEl = document.getElementById('detail-status-text');
  const statusDot = document.getElementById('detail-status-dot');
  const statusMetaEl = document.getElementById('detail-status-meta');
  const statusValue = n.status || 'operational';
  statusEl.textContent = statusValue.charAt(0).toUpperCase() + statusValue.slice(1);
  statusDot.className = 'status-dot ' + statusValue;
  statusMetaEl.textContent = n.statusMeta || 'Active';

  // Description + purpose
  document.getElementById('detail-description').textContent = n.description || '—';
  document.getElementById('detail-purpose').textContent = n.purpose || '—';

  // Metrics
  const metricsSection = document.getElementById('detail-metrics-section');
  const metricsEl = document.getElementById('detail-metrics');
  if (n.metrics && Object.keys(n.metrics).length > 0) {
    metricsSection.style.display = '';
    metricsEl.innerHTML = Object.entries(n.metrics).map(([k, v]) => `
      <div class="metric-card">
        <div class="metric-label">${escapeHtml(k)}</div>
        <div class="metric-value">${escapeHtml(String(v))}</div>
      </div>
    `).join('');
  } else {
    metricsSection.style.display = 'none';
  }

  // Connections
  const connEl = document.getElementById('detail-connections');
  const connections = (ADJ[id] || []).map(cid => NODE_BY_ID[cid]).filter(Boolean);
  if (connections.length === 0) {
    document.getElementById('detail-connections-section').style.display = 'none';
  } else {
    document.getElementById('detail-connections-section').style.display = '';
    connEl.innerHTML = connections.map(c => {
      const ccat = CATEGORIES[c.cat] || CATEGORIES.core;
      return `
        <div class="connection-item" data-jump="${c.id}">
          <div class="connection-item-icon" style="background:${ccat.bgVar};border:1px solid ${ccat.lineVar};color:${ccat.color}">
            ${buildIconSvg(c.icon, ccat.color).replace('<svg', '<svg width="12" height="12"')}
          </div>
          <div class="connection-item-name">${escapeHtml(c.label)}</div>
          <svg class="connection-item-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      `;
    }).join('');
    connEl.querySelectorAll('.connection-item').forEach(el => {
      el.addEventListener('click', () => selectNode(el.dataset.jump));
    });
  }

  panel.classList.add('open');
}

function highlightConnections(id) {
  const neighbors = new Set(ADJ[id] || []);
  neighbors.add(id);
  document.querySelectorAll('.node-group').forEach(g => {
    if (neighbors.has(g.dataset.id)) g.classList.remove('dimmed');
    else g.classList.add('dimmed');
  });
  document.querySelectorAll('.edge-line').forEach(el => {
    const [a, b] = el.dataset.edge.split('__');
    if (a === id || b === id) {
      el.classList.add('active');
      el.classList.remove('dimmed');
    } else {
      el.classList.remove('active');
      el.classList.add('dimmed');
    }
  });
}

function clearSelection() {
  selectedId = null;
  document.querySelectorAll('.node-group').forEach(g => { g.classList.remove('dimmed'); g.classList.remove('selected'); });
  document.querySelectorAll('.edge-line').forEach(el => { el.classList.remove('active'); el.classList.remove('dimmed'); });
  panel.classList.remove('open');
}

function shade(hex, percent) {
  const num = parseInt(hex.replace('#',''), 16);
  let r = (num >> 16) + percent;
  let g = ((num >> 8) & 0x00FF) + percent;
  let b = (num & 0x0000FF) + percent;
  r = Math.max(Math.min(255, r), 0);
  g = Math.max(Math.min(255, g), 0);
  b = Math.max(Math.min(255, b), 0);
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

document.getElementById('detail-close').addEventListener('click', clearSelection);
stage.addEventListener('click', (e) => {
  if (e.target === stage || e.target === svg) clearSelection();
});

// ============================================================
// PAN / ZOOM
// ============================================================
let isPanning = false, panStart = { x: 0, y: 0 }, viewStart = { x: 0, y: 0 };

stage.addEventListener('mousedown', (e) => {
  if (e.target.closest('.node-group')) return;
  isPanning = true;
  stage.classList.add('dragging');
  panStart = { x: e.clientX, y: e.clientY };
  viewStart = { x: VIEW.x, y: VIEW.y };
});
window.addEventListener('mousemove', (e) => {
  if (!isPanning) return;
  const dx = (e.clientX - panStart.x) / VIEW.k;
  const dy = (e.clientY - panStart.y) / VIEW.k;
  VIEW.x = viewStart.x - dx;
  VIEW.y = viewStart.y - dy;
  setSvgViewBox();
});
window.addEventListener('mouseup', () => {
  isPanning = false;
  stage.classList.remove('dragging');
});

stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.92 : 1.08;
  const newK = Math.max(0.4, Math.min(3, VIEW.k * delta));
  VIEW.k = newK;
  setSvgViewBox();
  updateZoomLevel();
}, { passive: false });

// Touch support
let touchStart = null, touchViewStart = null, touchDist = null, touchK = null;
stage.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    if (e.target.closest('.node-group')) return;
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    touchViewStart = { x: VIEW.x, y: VIEW.y };
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    touchDist = Math.sqrt(dx*dx + dy*dy);
    touchK = VIEW.k;
  }
}, { passive: true });
stage.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1 && touchStart) {
    const dx = (e.touches[0].clientX - touchStart.x) / VIEW.k;
    const dy = (e.touches[0].clientY - touchStart.y) / VIEW.k;
    VIEW.x = touchViewStart.x - dx;
    VIEW.y = touchViewStart.y - dy;
    setSvgViewBox();
  } else if (e.touches.length === 2 && touchDist) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const newDist = Math.sqrt(dx*dx + dy*dy);
    const ratio = newDist / touchDist;
    VIEW.k = Math.max(0.4, Math.min(3, touchK * ratio));
    setSvgViewBox();
    updateZoomLevel();
  }
}, { passive: true });
stage.addEventListener('touchend', () => {
  touchStart = null; touchDist = null;
});

function updateZoomLevel() {
  document.getElementById('zoom-level').textContent = Math.round(VIEW.k * 100) + '%';
}

document.getElementById('zoom-in').addEventListener('click', () => {
  VIEW.k = Math.min(3, VIEW.k * 1.2); setSvgViewBox(); updateZoomLevel();
});
document.getElementById('zoom-out').addEventListener('click', () => {
  VIEW.k = Math.max(0.4, VIEW.k / 1.2); setSvgViewBox(); updateZoomLevel();
});
document.getElementById('zoom-fit').addEventListener('click', resetView);
document.getElementById('btn-reset').addEventListener('click', () => {
  resetView(); clearSelection();
});

function resetView() {
  VIEW.x = 0; VIEW.y = 0; VIEW.k = 1;
  setSvgViewBox();
  updateZoomLevel();
}

// ============================================================
// FILTERS
// ============================================================
const activeFilters = new Set(Object.keys(CATEGORIES));

function renderFilters() {
  const rail = document.getElementById('filter-rail');
  rail.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'filter-chip active';
  allChip.innerHTML = `<span class="filter-chip-dot" style="background:var(--text-soft)"></span>All`;
  allChip.dataset.cat = 'all';
  rail.appendChild(allChip);
  Object.keys(CATEGORIES).forEach(key => {
    const c = CATEGORIES[key];
    const btn = document.createElement('button');
    btn.className = 'filter-chip active';
    btn.dataset.cat = key;
    btn.innerHTML = `<span class="filter-chip-dot" style="background:${c.color}"></span>${c.label}`;
    rail.appendChild(btn);
  });
  rail.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const cat = chip.dataset.cat;
      if (cat === 'all') {
        Object.keys(CATEGORIES).forEach(k => activeFilters.add(k));
        rail.querySelectorAll('.filter-chip').forEach(c => c.classList.add('active'));
      } else {
        if (activeFilters.has(cat)) {
          activeFilters.delete(cat);
          chip.classList.remove('active');
        } else {
          activeFilters.add(cat);
          chip.classList.add('active');
        }
        const allActive = activeFilters.size === Object.keys(CATEGORIES).length;
        rail.querySelector('[data-cat="all"]').classList.toggle('active', allActive);
      }
      applyFilters();
    });
  });
}

function applyFilters() {
  document.querySelectorAll('.node-group').forEach(g => {
    const id = g.dataset.id;
    const n = NODE_BY_ID[id];
    if (!n) return;
    const visible = id === 'center' || activeFilters.has(n.cat);
    g.style.display = visible ? '' : 'none';
  });
  document.querySelectorAll('.edge-line').forEach(el => {
    const [a, b] = el.dataset.edge.split('__');
    const na = NODE_BY_ID[a], nb = NODE_BY_ID[b];
    const visible = (a === 'center' || activeFilters.has(na?.cat)) && (b === 'center' || activeFilters.has(nb?.cat));
    el.style.display = visible ? '' : 'none';
  });
}

// ============================================================
// SEARCH
// ============================================================
const searchInput = document.getElementById('search-input');
searchInput.addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) {
    document.querySelectorAll('.node-group').forEach(g => g.classList.remove('dimmed'));
    return;
  }
  document.querySelectorAll('.node-group').forEach(g => {
    const n = NODE_BY_ID[g.dataset.id];
    if (!n) return;
    const hay = (n.label + ' ' + (n.sublabel || '') + ' ' + (n.url || '') + ' ' + (n.description || '')).toLowerCase();
    if (hay.includes(q)) g.classList.remove('dimmed');
    else g.classList.add('dimmed');
  });
});
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) return;
    const match = NODES.find(n => (n.label + ' ' + (n.id || '')).toLowerCase().includes(q));
    if (match) selectNode(match.id);
  }
});

// Cmd+K to focus search
window.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  }
  if (e.key === 'Escape') {
    clearSelection();
  }
});

// ============================================================
// INIT
// ============================================================
renderFilters();
paintGraph();
updateZoomLevel();

window.addEventListener('resize', setSvgViewBox);
</script>
</body>
</html>
