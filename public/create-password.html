<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Create Your Account · AI Lead Intel</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #08080a; --surface: #111114; --surface-2: #16161b; --surface-3: #1c1c22; --surface-input: #0d0d10;
  --border: rgba(255,255,255,0.06); --border-2: rgba(255,255,255,0.10); --border-3: rgba(255,255,255,0.14);
  --text: #fafafa; --text-soft: #d4d4d8; --text-dim: #a1a1aa; --text-faint: #71717a;
  --brand: #ff6a00; --brand-2: #ff9a00; --brand-3: #ff8533;
  --brand-glow: rgba(255,106,0,0.32); --brand-soft: rgba(255,106,0,0.10);
  --brand-tint: rgba(255,106,0,0.05); --brand-line: rgba(255,106,0,0.22);
  --green: #34d399; --green-soft: rgba(52,211,153,0.10); --green-line: rgba(52,211,153,0.28);
  --hot: #ef4444; --hot-soft: rgba(239,68,68,0.10); --hot-line: rgba(239,68,68,0.28);
}
html, body { height: 100%; }
body { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; letter-spacing: -0.011em; -webkit-font-smoothing: antialiased; }
body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(255,106,0,0.10), transparent 60%); pointer-events: none; z-index: 0; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; outline: none; }
.topnav { position: relative; z-index: 100; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(8,8,10,0.7); backdrop-filter: blur(20px); }
.logo { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.logo-mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: 0 0 18px var(--brand-glow), inset 0 1px 0 rgba(255,255,255,0.25); }
.support-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; background: var(--surface-2); border: 1px solid var(--border-2); border-radius: 99px; font-size: 12px; color: var(--text-dim); font-weight: 500; }
@media (max-width: 720px) { .topnav { padding: 12px 16px; } }
.wrap { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; padding: 56px 24px 80px; }
.hero { text-align: center; margin-bottom: 28px; }
.hero-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--brand); background: var(--brand-soft); border: 1px solid var(--brand-line); padding: 6px 14px; border-radius: 99px; font-weight: 600; margin-bottom: 18px; }
.hero-eyebrow .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 8px var(--brand-glow); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.7); } }
.hero-title { font-size: clamp(27px, 4vw, 34px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 12px; }
.hero-title .accent { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; background: linear-gradient(135deg, var(--brand), var(--brand-2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hero-sub { font-size: 14.5px; color: var(--text-dim); line-height: 1.55; max-width: 360px; margin: 0 auto; }
.card { background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%); border: 1px solid var(--border); border-radius: 18px; padding: 32px; box-shadow: 0 24px 60px rgba(0,0,0,0.45); position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--brand-line), transparent); }
.field { margin-bottom: 16px; }
.float-wrap { position: relative; }
.float-input { width: 100%; padding: 22px 16px 10px; background: var(--surface-input); border: 1px solid var(--border-2); border-radius: 12px; color: var(--text); font-size: 15px; transition: border-color 0.18s, box-shadow 0.18s, background 0.18s; font-weight: 500; }
.float-input:hover { border-color: var(--border-3); }
.float-input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-tint); background: #0c0c0f; }
.float-label { position: absolute; left: 16px; top: 18px; font-size: 14px; color: var(--text-faint); pointer-events: none; transition: all 0.18s cubic-bezier(0.16,1,0.3,1); font-weight: 500; }
.float-input:focus ~ .float-label, .float-input:not(:placeholder-shown) ~ .float-label { top: 8px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brand); font-weight: 600; }
.float-input:-webkit-autofill { -webkit-text-fill-color: var(--text) !important; -webkit-box-shadow: 0 0 0 1000px var(--surface-input) inset !important; caret-color: var(--text); }
.password-hint { font-size: 11.5px; color: var(--text-faint); margin-top: 6px; padding-left: 4px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px 20px; border-radius: 11px; font-size: 14px; font-weight: 600; transition: all 0.2s cubic-bezier(0.16,1,0.3,1); border: 1px solid transparent; cursor: pointer; min-height: 48px; margin-top: 6px; }
.btn-primary { background: linear-gradient(135deg, var(--brand), var(--brand-3)); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 4px 14px var(--brand-glow); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), 0 10px 26px var(--brand-glow); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.spinner { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.form-msg { display: none; align-items: center; gap: 9px; padding: 11px 14px; border-radius: 11px; font-size: 13px; font-weight: 500; margin-bottom: 16px; line-height: 1.45; }
.form-msg.visible { display: flex; }
.form-msg svg { flex-shrink: 0; }
.form-msg.error { background: var(--hot-soft); border: 1px solid var(--hot-line); color: var(--hot); }
.form-msg.success { background: var(--green-soft); border: 1px solid var(--green-line); color: var(--green); }
.bottom-link { text-align: center; margin-top: 22px; font-size: 13px; color: var(--text-faint); }
.bottom-link a { color: var(--brand); font-weight: 500; }
@media (max-width: 480px) { .wrap { padding: 40px 18px 60px; } .card { padding: 24px 20px; } }
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18217723734"></script>

</script>
</head>
<body>
<nav class="topnav">
  <a href="/" class="logo"><div class="logo-mark"></div><span>AI Lead Intel</span></a>
  <a href="mailto:support@aileadintel.com" class="support-pill">Support</a>
</nav>
<div class="wrap">
  <header class="hero">
    <div class="hero-eyebrow"><span class="dot"></span>Final step</div>
    <h1 class="hero-title">Create Your <span class="accent">Account</span></h1>
    <p class="hero-sub">Create a password to activate your AI Lead Intel account.</p>
  </header>
  <div class="card">
    <div class="form-msg" id="form-msg">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="form-msg-text"></span>
    </div>
    <div class="field">
      <div class="float-wrap">
        <input type="email" id="email" class="float-input" placeholder=" " autocomplete="email" />
        <label class="float-label" for="email">Email</label>
      </div>
    </div>
    <div class="field">
      <div class="float-wrap">
        <input type="password" id="password" class="float-input" placeholder=" " autocomplete="new-password" />
        <label class="float-label" for="password">Password</label>
      </div>
      <div class="password-hint">At least 8 characters.</div>
    </div>
    <div class="field">
      <div class="float-wrap">
        <input type="password" id="password_confirm" class="float-input" placeholder=" " autocomplete="new-password" />
        <label class="float-label" for="password_confirm">Confirm Password</label>
      </div>
    </div>
    <button class="btn btn-primary" id="submit-btn" type="button">
      <span id="submit-label">Create Account</span>
    </button>
  </div>
  <div class="bottom-link">Already activated? <a href="/sign-in">Sign in</a></div>
</div>
<script>
'use strict';
const SUPABASE_URL = 'https://mbrhkeddgmywqqgdfdgx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__YkhmAu61Nr8VetJS8pJqA_MHrmO69t';
const CREATE_ACCOUNT_ENDPOINT = '/api/auth-link-user';  // your live account-creation API
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Read params (onboarding-return passes ?slug & ?email; the backup email link passes ?slug only)
const urlParams = new URLSearchParams(window.location.search);
const prefillSlug = (urlParams.get('slug') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
const prefillEmail = (urlParams.get('email') || urlParams.get('report_email') || '').trim();
const prefillPlan = (urlParams.get('plan') || '').toLowerCase().trim();
if (prefillEmail) document.getElementById('email').value = prefillEmail;

function showMsg(type, text) {
  const el = document.getElementById('form-msg');
  const txt = document.getElementById('form-msg-text');
  el.classList.remove('error', 'success');
  el.classList.add(type, 'visible');
  txt.textContent = text;
}
function hideMsg() { document.getElementById('form-msg').classList.remove('visible'); }

let busy = false;
const submitBtn = document.getElementById('submit-btn');
const submitLabel = document.getElementById('submit-label');
function resetBtn() { busy = false; submitBtn.disabled = false; submitLabel.textContent = 'Create Account'; }

async function submit() {
  if (busy) return;
  hideMsg();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('password_confirm').value;
  if (!email || !email.includes('@')) { showMsg('error', 'Please enter a valid email.'); return; }
  if (password.length < 8) { showMsg('error', 'Password must be at least 8 characters.'); return; }
  if (password !== confirm) { showMsg('error', "Passwords don't match."); return; }

  busy = true; submitBtn.disabled = true; submitLabel.innerHTML = '<span class="spinner"></span>';

  try {
    // 1. Create the auth user + link owner_user_id to the client row
    const res = await fetch(CREATE_ACCOUNT_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, client_slug: prefillSlug }),
    });
    const result = await res.json().catch(() => null);
    if (!res.ok || !result || result.success !== true) {
      showMsg('error', (result && result.error) || `Couldn't create your account (HTTP ${res.status}).`);
      resetBtn();
      return;
    }
    const slug = result.client_slug || prefillSlug || '';

    // 2. Auto sign-in with the password just set
    showMsg('success', 'Account created successfully. Redirecting...');
    const { error: signInErr } = await supabase.auth.signInWithPassword({ email, password });
    if (signInErr) {
      // Account exists but auto-login failed — send them to sign-in.
      console.error('[create-password] auto sign-in failed:', signInErr.message);
      setTimeout(() => window.location.assign('/sign-in?email=' + encodeURIComponent(email) + '&just_created=1'), 700);
      return;
    }

    // 3. Signed in → route by the plan the SERVER says this account is on
    //    (the URL param is just a fallback — email links don't always carry it).
    //    Starter goes straight to phone setup: their AI number + on-screen
    //    forwarding instructions (no waiting on an email). Pro → /setup.
    const effectivePlan = ((result.plan || '') + '').toLowerCase() || prefillPlan;
    const dest = effectivePlan === 'starter'
      ? (slug ? '/phone-setup?slug=' + encodeURIComponent(slug) : '/phone-setup')
      : (slug ? '/setup?slug=' + encodeURIComponent(slug) : '/setup');
    setTimeout(() => window.location.assign(dest), 700);
  } catch (err) {
    console.error('[create-password] error:', err);
    showMsg('error', 'Network error. Please try again.');
    resetBtn();
  }
}

submitBtn.addEventListener('click', submit);
document.querySelectorAll('.float-input').forEach(input => {
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
});
</script>
</body>
</html>
